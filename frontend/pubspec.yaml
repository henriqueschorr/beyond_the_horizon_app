name: frontend
description: Flutter Web client for Beyond the Horizon App digital companion platform.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared:
    path: ../shared
  backend:
    path: ../backend
  get_it: ^7.6.0
  go_router: ^14.0.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
